    <script>
        // State management
        const state = {
            currentMonth: 8, // September (0-indexed)
            currentYear: 2026,
            activeTab: 'numbers', // 'numbers' or 'badges'
            placements: {}, // key: "year-month-cellIndex", value: Array of placed items {id, type, text, color, bg, icon}
            draggedItem: null, // {id, type, text, color, bg, icon}
            isErasing: false,
            brushColor: '#0f172a',
            brushSize: 4
        };

        // Storage Keys
        const STORAGE_KEY_PLACEMENTS = 'studentCalendarPlacements';
        const STORAGE_KEY_MONTH = 'studentCalendarMonth';
        const STORAGE_KEY_CANVAS = 'studentCalendarCanvas';

        function saveCalendarState() {
            try {
                localStorage.setItem(STORAGE_KEY_PLACEMENTS, JSON.stringify(state.placements));
                localStorage.setItem(STORAGE_KEY_MONTH, state.currentMonth.toString());
            } catch (e) {
                console.error('Could not save calendar state:', e);
            }
        }

        function saveCanvasState() {
            try {
                localStorage.setItem(STORAGE_KEY_CANVAS, notesCanvas.toDataURL());
            } catch (e) {
                console.error('Could not save canvas state:', e);
            }
        }

        function loadSavedState() {
            try {
                const savedMonth = localStorage.getItem(STORAGE_KEY_MONTH);
                if (savedMonth !== null) {
                    state.currentMonth = parseInt(savedMonth, 10);
                    if (monthSelect) monthSelect.value = state.currentMonth;
                }

                const savedPlacements = localStorage.getItem(STORAGE_KEY_PLACEMENTS);
                if (savedPlacements) {
                    state.placements = JSON.parse(savedPlacements);
                }
            } catch (e) {
                console.error('Could not load saved state:', e);
            }
        }

        // Event Badge definitions
        const eventBadges = [
            { id: 'badge-hol', text: 'Holiday', bg: 'bg-rose-100', textCol: 'text-rose-700', border: 'border-rose-300', icon: 'fa-umbrella-beach' },

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        const monthSelect = document.getElementById('monthSelect');

        // Modal Elements
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }
        modalCloseBtn.addEventListener('click', () => modal.classList.add('hidden'));

        // Initialize App
        function init() {
            loadSavedState();
            renderTrayItems();
            renderCalendar();
            initCanvas();
        }

        // Render Tray Items (Numbers 1-31 & Badges)
        function renderTrayItems() {
            // Numbers 1 to 31
            numbersSection.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const item = document.createElement('div');
                item.className = 'draggable-item bg-white border-2 border-slate-200 hover:border-indigo-500 hover:shadow-md rounded-xl p-2 text-center font-bold text-slate-800 text-base transition flex items-center justify-center h-12 select-none';
                item.textContent = i;
                item.dataset.type = 'number';
                item.dataset.id = `num-${i}`;
                item.dataset.value = i;
                
                attachDragListeners(item, { type: 'number', id: `num-${i}`, text: i.toString() });
                numbersSection.appendChild(item);
            }

            // Badges
            badgesSection.innerHTML = '';
            eventBadges.forEach(badge => {
                const item = document.createElement('div');
                item.className = `draggable-item ${badge.bg} ${badge.textCol} border ${badge.border} hover:shadow-md rounded-xl p-2 font-semibold text-xs transition flex items-center space-x-2 h-12 px-3 select-none`;
                item.innerHTML = `<i class="fa-solid ${badge.icon} text-sm"></i><span class="truncate">${badge.text}</span>`;
                item.dataset.type = 'badge';
                item.dataset.id = badge.id;
                
                attachDragListeners(item, { type: 'badge', id: badge.id, text: badge.text, bg: `${badge.bg} ${badge.textCol} border ${badge.border}`, icon: badge.icon });
                badgesSection.appendChild(item);
            });
        }
