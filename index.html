<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Calendar & Morning Check-in</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .draggable-item {
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .draggable-item:active { cursor: grabbing; }
        .drop-target {
            transition: background-color 0.15s, border-color 0.15s;
        }
        .drop-target.drag-over {
            background-color: rgba(79, 70, 229, 0.25);
            border-color: #4338ca;
        }
        
        /* Darker, classic crayon-box rainbow texture */
        .crayon-rainbow-bg {
            background-color: #facc15;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.25) 0%, rgba(0, 0, 0, 0.08) 100%),
                repeating-linear-gradient(
                    135deg,
                    rgba(220, 38, 38, 0.72) 0px,
                    rgba(220, 38, 38, 0.72) 60px,
                    rgba(234, 88, 12, 0.72) 60px,
                    rgba(234, 88, 12, 0.72) 120px,
                    rgba(234, 179, 8, 0.72) 120px,
                    rgba(234, 179, 8, 0.72) 180px,
                    rgba(22, 163, 74, 0.72) 180px,
                    rgba(22, 163, 74, 0.72) 240px,
                    rgba(37, 99, 235, 0.72) 240px,
                    rgba(37, 99, 235, 0.72) 300px,
                    rgba(126, 34, 206, 0.72) 300px,
                    rgba(126, 34, 206, 0.72) 360px
                ),
                repeating-linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.18) 0px,
                    rgba(255, 255, 255, 0.18) 2px,
                    transparent 2px,
                    transparent 5px
                );
            background-attachment: fixed;
        }

        .frosted-panel {
            background-color: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="h-full crayon-rainbow-bg text-slate-800 flex flex-col overflow-hidden">

    <!-- Top Navigation Bar (Compact) -->
    <header class="frosted-panel border-b border-white/50 px-3 py-2 flex items-center justify-between shrink-0 shadow-sm z-20">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 bg-indigo-700 rounded-lg flex items-center justify-center text-white shadow-sm">
                <i class="fa-solid fa-calendar-days text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-sm leading-tight">Student Calendar & Check-in</h1>
                <p class="text-[11px] text-slate-600 hidden sm:block">Fill calendar • Choose greeting & feeling • Write notes</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <select id="monthSelect" class="bg-white/95 border border-slate-300 text-slate-800 text-xs rounded-lg px-2.5 py-1.5 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs">
                <option value="8">September 2026</option>
                <option value="9">October 2026</option>
                <option value="10">November 2026</option>
                <option value="11">December 2026</option>
                <option value="0">January 2027</option>
                <option value="1">February 2027</option>
                <option value="2">March 2027</option>
                <option value="3">April 2027</option>
                <option value="4">May 2027</option>
                <option value="5">June 2027</option>
            </select>

            <button id="resetBtn" class="bg-rose-100 hover:bg-rose-200 text-rose-800 border border-rose-300 px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow-xs" title="Reset All">
                <i class="fa-solid fa-rotate-right"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative p-2 lg:p-3 gap-2 lg:gap-3">

        <!-- Left Sidebar: Good Morning Header -> Numbers Tray -> Morning Greeting -> Feelings -->
        <aside class="w-full lg:w-72 frosted-panel border border-white/60 rounded-xl flex flex-col shrink-0 shadow-md overflow-hidden">
            
            <!-- Happy Good Morning Icon Header -->
            <div class="p-2 border-b border-white/50 bg-amber-50/70 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-1.5">
                    <span class="text-xl leading-none">☀️</span>
                    <span class="font-extrabold text-amber-900 text-xs tracking-wide">Good Morning!</span>
                </div>
                <div class="flex space-x-1">
                    <button id="tabNums" class="px-2 py-0.5 text-xs font-bold rounded-md bg-indigo-700 text-white shadow-xs">Numbers</button>
                    <button id="tabBadges" class="px-2 py-0.5 text-xs font-bold rounded-md bg-white/70 text-slate-700 hover:bg-white">Badges</button>
                </div>
            </div>

            <!-- Number and Badge Tray (Positioned right above Morning Greeting) -->
            <div class="flex-1 overflow-y-auto p-2 min-h-[110px]" id="trayContainer">
                <!-- Numbers Section (1 to 31) -->
                <div id="numbersSection" class="grid grid-cols-5 gap-1.5"></div>

                <!-- Event Badges Section -->
                <div id="badgesSection" class="hidden space-y-1.5"></div>
            </div>

            <!-- Greeting Choice Section (Right below Numbers) -->
            <div class="border-t border-white/60 bg-white/50 p-2 flex flex-col shrink-0">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-extrabold text-slate-800 flex items-center space-x-1.5">
                        <i class="fa-solid fa-handshake-angle text-indigo-600 text-xs"></i>
                        <span>Morning Greeting</span>
                    </span>
                    <span id="selectedGreetingText" class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Choose one</span>
                </div>
                <div class="grid grid-cols-5 gap-1" id="greetingsGrid">
                    <button class="greeting-btn flex flex-col items-center justify-center p-1 rounded-lg border border-sky-300 bg-sky-50 hover:bg-sky-100 transition shadow-2xs" data-greeting="Fist Bump" title="Fist Bump">
                        <span class="text-lg leading-none">👊</span>
                        <span class="text-[9px] font-bold text-sky-900 mt-0.5 truncate w-full text-center">Fist</span>
                    </button>
                    <button class="greeting-btn flex flex-col items-center justify-center p-1 rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100 transition shadow-2xs" data-greeting="High Five" title="High Five">
                        <span class="text-lg leading-none">✋</span>
                        <span class="text-[9px] font-bold text-amber-900 mt-0.5 truncate w-full text-center">Five</span>
                    </button>
                    <button class="greeting-btn flex flex-col items-center justify-center p-1 rounded-lg border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 transition shadow-2xs" data-greeting="Handshake" title="Handshake">
                        <span class="text-lg leading-none">🤝</span>
                        <span class="text-[9px] font-bold text-emerald-900 mt-0.5 truncate w-full text-center">Shake</span>
                    </button>
                    <button class="greeting-btn flex flex-col items-center justify-center p-1 rounded-lg border border-rose-300 bg-rose-50 hover:bg-rose-100 transition shadow-2xs" data-greeting="Heart Hands" title="Heart Hands">
                        <span class="text-lg leading-none">🫶</span>
                        <span class="text-[9px] font-bold text-rose-900 mt-0.5 truncate w-full text-center">Heart</span>
                    </button>
                    <button class="greeting-btn flex flex-col items-center justify-center p-1 rounded-lg border border-purple-300 bg-purple-50 hover:bg-purple-100 transition shadow-2xs" data-greeting="Hug" title="Hug">
                        <span class="text-lg leading-none">🫂</span>
                        <span class="text-[9px] font-bold text-purple-900 mt-0.5 truncate w-full text-center">Hug</span>
                    </button>
                </div>
            </div>

            <!-- 6 Feelings Check-in Card (At the bottom of sidebar) -->
            <div class="border-t border-white/60 bg-white/50 p-2 flex flex-col shrink-0">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-extrabold text-slate-800 flex items-center space-x-1.5">
                        <i class="fa-solid fa-face-smile text-amber-500 text-xs"></i>
                        <span>How are you feeling today?</span>
                    </span>
                    <span id="selectedFeelingText" class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Select one</span>
                </div>
                
                <div class="grid grid-cols-3 gap-1" id="feelingsGrid">
                    <button class="feeling-btn flex flex-col items-center justify-center p-1 rounded-lg border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 transition text-center shadow-2xs" data-feeling="Happy">
                        <span class="text-lg leading-none">😊</span>
                        <span class="text-[9px] font-bold text-emerald-800 mt-0.5">Happy</span>
                    </button>
                    <button class="feeling-btn flex flex-col items-center justify-center p-1 rounded-lg border border-sky-300 bg-sky-50 hover:bg-sky-100 transition text-center shadow-2xs" data-feeling="Sad">
                        <span class="text-lg leading-none">😢</span>
